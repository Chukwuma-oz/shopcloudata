AWSTemplateFormatVersion: '2010-09-09'
Description: ShopCloud - public ALB, private EC2 Auto Scaling and CloudWatch.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id

  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id

  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id

  AppSubnetA:
    Type: AWS::EC2::Subnet::Id

  AppSubnetB:
    Type: AWS::EC2::Subnet::Id

  AmiId:
    Type: AWS::EC2::Image::Id

  EcrImageUri:
    Type: String

  DatabaseSecretArn:
    Type: String

  DatabaseEndpoint:
    Type: String

  RedisEndpoint:
    Type: String

  ALBSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: ShopCloudRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"

              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"

              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /shopcloud/backend
      RetentionInDays: 14

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: t3.micro

        IamInstanceProfile:
          Name: !Ref InstanceProfile

        SecurityGroupIds:
          - !Ref AppSecurityGroupId

        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eux

            dnf install -y docker awscli
            systemctl enable --now docker

            REGION="${AWS::Region}"
            IMAGE="${EcrImageUri}"

            ACCOUNT_REGISTRY="$(echo "$IMAGE" | cut -d/ -f1)"

            aws ecr get-login-password \
              --region "$REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ACCOUNT_REGISTRY"

            SECRET_JSON="$(aws secretsmanager get-secret-value \
              --secret-id "${DatabaseSecretArn}" \
              --region "$REGION" \
              --query SecretString \
              --output text)"

            DB_USER="$(echo "$SECRET_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["username"])')"

            DB_PASS="$(echo "$SECRET_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["password"])')"

            docker pull "$IMAGE"

            docker rm -f shopcloud-backend || true

            docker run -d \
              --name shopcloud-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              -e PORT=5000 \
              -e DB_HOST="${DatabaseEndpoint}" \
              -e DB_PORT=3306 \
              -e DB_NAME=shopcloud \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASS" \
              -e REDIS_HOST="${RedisEndpoint}" \
              -e REDIS_PORT=6379 \
              -e REDIS_TLS=true \
              "$IMAGE"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 5000
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application

      SecurityGroups:
        - !Ref ALBSecurityGroupId

      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Listener
    Properties:
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 2

      VPCZoneIdentifier:
        - !Ref AppSubnetA
        - !Ref AppSubnetB

      TargetGroupARNs:
        - !Ref TargetGroup

      HealthCheckType: ELB
      HealthCheckGracePeriod: 180

      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber

  CPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ShopCloud backend high CPU
      Namespace: AWS/EC2
      MetricName: CPUUtilization

      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref ASG

      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold

Outputs:
  LoadBalancerDNS:
    Value: !GetAtt ALB.DNSName

  AppSecurityGroupId:
    Value: !Ref AppSecurityGroupId

  ALBSecurityGroupId:
    Value: !Ref ALBSecurityGroupId