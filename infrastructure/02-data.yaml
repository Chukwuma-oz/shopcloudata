AWSTemplateFormatVersion: '2010-09-09'
Description: ShopCloud - private RDS MySQL Multi-AZ, ElastiCache Redis and Secrets Manager.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  DataSubnetA:
    Type: AWS::EC2::Subnet::Id
  DataSubnetB:
    Type: AWS::EC2::Subnet::Id
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL access only from ShopCloud application instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroupId

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis access only from ShopCloud application instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref AppSecurityGroupId

  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/database
      GenerateSecretString:
        SecretStringTemplate: '{"username":"shopcloud"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"@/\\'

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: ShopCloud private database subnets
      SubnetIds: [!Ref DataSubnetA, !Ref DataSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: "8.0"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      MultiAZ: true
      PubliclyAccessible: false
      StorageEncrypted: true
      BackupRetentionPeriod: 0
      DBName: shopcloud
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: ShopCloud private Redis subnets
      SubnetIds: [!Ref DataSubnetA, !Ref DataSubnetB]

  Redis:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: ShopCloud query cache
      Engine: redis
      CacheNodeType: cache.t3.micro
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      TransitEncryptionEnabled: true
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds: [!Ref RedisSecurityGroup]

Outputs:
  DatabaseSecretArn: {Value: !Ref DBSecret}
  DatabaseEndpoint: {Value: !GetAtt Database.Endpoint.Address}
  RedisPrimaryEndpoint: {Value: !GetAtt Redis.PrimaryEndPoint.Address}
  DatabaseSecurityGroupId: {Value: !Ref DatabaseSecurityGroup}
  RedisSecurityGroupId: {Value: !Ref RedisSecurityGroup}
