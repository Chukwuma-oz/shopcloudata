services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopcloud
      MYSQL_USER: shopcloud
      MYSQL_PASSWORD: shopcloud
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: shopcloud
      DB_USER: shopcloud
      DB_PASSWORD: shopcloud
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
